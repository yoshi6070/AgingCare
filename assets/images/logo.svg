<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 450" width="400" height="450">
  <defs>
    <!-- Flower petal shapes -->
    <path id="petal" d="M0,-40 C12,-38 25,-20 28,0 C25,20 12,38 0,40 C-12,38 -25,20 -28,0 C-25,-20 -12,-38 0,-40 Z"/>
  </defs>

  <!-- Flower petals around head -->
  <!-- Pink petals -->
  <g transform="translate(200,160)">
    <!-- Top-right pink -->
    <g transform="translate(40,-60) rotate(20)">
      <ellipse rx="36" ry="48" fill="#e84b8a" opacity="0.85"/>
      <ellipse rx="30" ry="42" fill="#f06ba8" opacity="0.6"/>
      <circle cx="0" cy="0" r="8" fill="#c8904a" opacity="0.7"/>
    </g>
    <!-- Right pink -->
    <g transform="translate(75,10) rotate(50)">
      <ellipse rx="34" ry="46" fill="#e84b8a" opacity="0.85"/>
      <ellipse rx="28" ry="40" fill="#f278b0" opacity="0.6"/>
      <circle cx="0" cy="0" r="7" fill="#c8904a" opacity="0.7"/>
    </g>
    <!-- Left pink -->
    <g transform="translate(-70,20) rotate(-30)">
      <ellipse rx="34" ry="44" fill="#e84b8a" opacity="0.8"/>
      <ellipse rx="28" ry="38" fill="#f06ba8" opacity="0.6"/>
      <circle cx="0" cy="0" r="7" fill="#c8904a" opacity="0.7"/>
    </g>

    <!-- Purple petals -->
    <g transform="translate(-45,-55) rotate(-15)">
      <ellipse rx="34" ry="46" fill="#b07cc8" opacity="0.8"/>
      <ellipse rx="28" ry="40" fill="#c99adc" opacity="0.5"/>
    </g>
    <g transform="translate(65,60) rotate(70)">
      <ellipse rx="32" ry="44" fill="#b07cc8" opacity="0.8"/>
      <ellipse rx="26" ry="38" fill="#c99adc" opacity="0.5"/>
    </g>
    <g transform="translate(-20,75) rotate(-60)">
      <ellipse rx="30" ry="42" fill="#b07cc8" opacity="0.75"/>
      <ellipse rx="24" ry="36" fill="#c99adc" opacity="0.5"/>
    </g>

    <!-- Blue petals -->
    <g transform="translate(-80,-20) rotate(-45)">
      <ellipse rx="34" ry="46" fill="#4dc4e0" opacity="0.8"/>
      <ellipse rx="28" ry="40" fill="#7dd4ea" opacity="0.5"/>
    </g>
    <g transform="translate(30,80) rotate(80)">
      <ellipse rx="32" ry="42" fill="#4dc4e0" opacity="0.8"/>
      <ellipse rx="26" ry="36" fill="#7dd4ea" opacity="0.5"/>
    </g>

    <!-- Green petals -->
    <g transform="translate(10,-85) rotate(5)">
      <ellipse rx="32" ry="44" fill="#6db844" opacity="0.8"/>
      <ellipse rx="26" ry="38" fill="#8dca6a" opacity="0.5"/>
    </g>
    <g transform="translate(80,-30) rotate(35)">
      <ellipse rx="30" ry="42" fill="#6db844" opacity="0.8"/>
      <ellipse rx="24" ry="36" fill="#8dca6a" opacity="0.5"/>
    </g>
    <g transform="translate(-85,50) rotate(-70)">
      <ellipse rx="28" ry="40" fill="#6db844" opacity="0.75"/>
      <ellipse rx="22" ry="34" fill="#8dca6a" opacity="0.5"/>
    </g>

    <!-- Yellow petals -->
    <g transform="translate(-30,-80) rotate(-10)">
      <ellipse rx="30" ry="42" fill="#e8d44d" opacity="0.8"/>
      <ellipse rx="24" ry="36" fill="#f0e07a" opacity="0.5"/>
      <circle cx="0" cy="0" r="7" fill="#c8904a" opacity="0.6"/>
    </g>
    <g transform="translate(60,70) rotate(60)">
      <ellipse rx="28" ry="40" fill="#e8d44d" opacity="0.8"/>
      <ellipse rx="22" ry="34" fill="#f0e07a" opacity="0.5"/>
      <circle cx="0" cy="0" r="6" fill="#c8904a" opacity="0.6"/>
    </g>

    <!-- Face silhouette (white) -->
    <ellipse cx="0" cy="12" rx="42" ry="56" fill="white"/>

    <!-- Lips -->
    <path d="M-10,30 Q-5,26 0,28 Q5,26 10,30 Q5,36 0,37 Q-5,36 -10,30 Z" fill="#e84b8a"/>

    <!-- Neck -->
    <path d="M-12,65 Q-10,80 -8,95 Q0,98 8,95 Q10,80 12,65" fill="white" stroke="none"/>

    <!-- Decorative curls -->
    <path d="M-85,60 Q-95,70 -88,80 Q-80,90 -75,80" fill="none" stroke="#333" stroke-width="1.5" stroke-linecap="round"/>
    <path d="M85,55 Q95,65 90,75 Q82,85 78,75" fill="none" stroke="#333" stroke-width="1.5" stroke-linecap="round"/>
    <path d="M-8,95 Q-15,110 -10,115" fill="none" stroke="#333" stroke-width="1.2" stroke-linecap="round"/>
    <path d="M8,95 Q15,108 12,115 Q10,120 5,118" fill="none" stroke="#333" stroke-width="1.2" stroke-linecap="round"/>
  </g>

  <!-- Sketch-like petal outlines -->
  <g transform="translate(200,160)" fill="none" stroke="#333" stroke-width="1" opacity="0.4">
    <ellipse cx="40" cy="-60" rx="36" ry="48" transform="rotate(20,40,-60)"/>
    <ellipse cx="75" cy="10" rx="34" ry="46" transform="rotate(50,75,10)"/>
    <ellipse cx="-70" cy="20" rx="34" ry="44" transform="rotate(-30,-70,20)"/>
    <ellipse cx="-45" cy="-55" rx="34" ry="46" transform="rotate(-15,-45,-55)"/>
    <ellipse cx="10" cy="-85" rx="32" ry="44" transform="rotate(5,10,-85)"/>
    <ellipse cx="80" cy="-30" rx="30" ry="42" transform="rotate(35,80,-30)"/>
    <ellipse cx="-80" cy="-20" rx="34" ry="46" transform="rotate(-45,-80,-20)"/>
  </g>

  <!-- Text: Kajiwara -->
  <text x="200" y="340" text-anchor="middle" font-family="'Georgia', 'Times New Roman', serif" font-style="italic" font-size="42" fill="#333" letter-spacing="1">Kajiwara</text>
  <!-- Text: Aging Care -->
  <text x="200" y="390" text-anchor="middle" font-family="'Georgia', 'Times New Roman', serif" font-style="italic" font-size="38" fill="#333" letter-spacing="1">Aging Care</text>
</svg>
